name: Disassemble Ori camera and aspect methods
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip
          python3 -m pip install --break-system-packages capstone lz4
      - name: Extract NSO and disassemble
        run: |
          cat main.7z.001 main.7z.002 > main.7z
          7z x main.7z -y
          python3 - <<'PY'
          import struct,lz4.block
          from capstone import *
          b=open('main','rb').read()
          fo,mem,usize=struct.unpack_from('<III',b,0x10)
          csize=struct.unpack_from('<I',b,0x60)[0]
          seg=lz4.block.decompress(b[fo:fo+csize],uncompressed_size=usize)
          rfo,rmem,rsize=struct.unpack_from('<III',b,0x20)
          rcsize=struct.unpack_from('<I',b,0x64)[0]
          rodata=lz4.block.decompress(b[rfo:rfo+rcsize],uncompressed_size=rsize)
          rfo,rmem,rsize=struct.unpack_from('<III',b,0x20)
          rcsize=struct.unpack_from('<I',b,0x64)[0]
          rodata=lz4.block.decompress(b[rfo:rfo+rcsize],uncompressed_size=rsize)
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          md.detail=True
          targets={
            'AspectRatioManager_get_AspectRatio':(0x36B0050,0x180),
            'AspectRatioManager_FixedUpdate':(0x36B61F0,0x500),
            'MaintainAspectRatio_LateUpdate':(0x37BC380,0x240),
            'ScalePositionForAspectRatio_ApplyAspect':(0x39C5AE0,0x240),
            'ScaleWidthForAspectRatio_ApplyAspect':(0x39C6520,0x240),
            'GameplayCamera_get_CameraWidthWorldUnits':(0x3B7B6E0,0x180),
            'CameraController_UpdateCamera':(0x430EA20,0x300),
            'CameraController_UpdateFrustrumPlanes':(0x430DE20,0x300),
          }
          with open('camera-disasm.txt','w') as out:
            out.write('CONSTANTS\\n')
            for x in [0x614E878,0x614EB10,0x614E568]:
              out.write(f'{x:#x}: {struct.unpack_from("<f",rodata,x-rmem)[0]} bytes={rodata[x-rmem:x-rmem+4].hex()}\\n')
            for name,(addr,size) in targets.items():
              out.write(f'\\n===== {name} RVA 0x{addr:X} =====\\n')
              for i in md.disasm(seg[addr:addr+size],addr):
                out.write(f'{i.address:08X}: {i.mnemonic:8} {i.op_str}\\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ori-camera-disassembly
          path: |
            camera-disasm.txt
            main
          retention-days: 7
